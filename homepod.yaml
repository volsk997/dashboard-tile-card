type: custom:vertical-stack-in-card
cards:
  - type: custom:mushroom-template-card
    primary: |-
      {% set title = state_attr(config.entity,'media_title') %}

      {% if is_state(config.entity, 'playing') %} 
        {% if state_attr(config.entity,'media_title') is none or  state_attr(config.entity,'media_title') == ''%} Недоступно
        {% else%}{{ title }}{% endif %}
      {% else %} Homepod Mini
      {% endif %}
    secondary: |-
      {% set title = state_attr(config.entity,'media_artist') %}

      {% if is_state(config.entity, 'playing') %} 
        {% if state_attr(config.entity,'media_artist') is none or  state_attr(config.entity,'media_artist') == ''%} Недоступно
        {% else%}{{ title }}{% endif %}
      {% else %} Не исполняется
      {% endif %}
    entity: media_player.homepod_mini_gost
    picture: "{{state_attr(config.entity, 'entity_picture')}}"
    badge_icon: ""
    badge_color: ""
    icon_color: |
      {% if is_state(config.entity, 'playing') %} 120,120,120
        {% else%} disabled
        {% endif %}
    tap_action:
      action: none
    double_tap_action:
      action: none
    fill_container: true
    layout: horizontal
    hold_action:
      action: none
    icon: phu:homepod-mini
    card_mod:
      style:
        mushroom-state-info$: |
          .container {
           --card-secondary-color: {{states('input_text.tsvet_shrifta_vtorostepennaia_informatsiia')}};
           padding-right: 25px;
        .: |
          {% include 'mushroom_ha_card_transparent.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        icon_color: ""
        icon: fas:backward-step
        tap_action:
          action: perform-action
          perform_action: media_player.media_previous_track
          target:
            entity_id:
              - media_player.homepod_mini_gost
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: template
        icon_color: ""
        icon: >
          {% set title = state_attr(config.entity,'media_title') %}


          {% if state_attr(config.entity,'media_title') is none or 
          state_attr(config.entity,'media_title') == ''%} fas:lock

          {% elif is_state(config.entity, 'playing') %} fas:pause

          {% elif is_state(config.entity, 'paused') %} fas:play

          {% else%}fas:play

          {% endif %}
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.homepod_play_pause_extended
          data:
            variables:
              entity: media_player.homepod_mini_gost
              user: stanislav
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: media_player.homepod_mini_gost
      - type: template
        icon_color: ""
        icon: fas:forward-step
        tap_action:
          action: perform-action
          perform_action: media_player.media_next_track
          target:
            entity_id: media_player.homepod_mini_gost
        hold_action:
          action: none
        double_tap_action:
          action: none
    alignment: justify
    card_mod:
      style: |
        {% set top = 8 %} 
        {% set font_weight = 400 %}
        {% set font_size = 14 %}
        {% set chip_height = 45 %}
        {% include 'chip_secondary_shape.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        icon: >-
          {% if states(config.entity) in ['unknown', 'unavailable', 'none']  %}
          mdi:alert-circle

          {% else %} mdi:chevron-right

          {% endif %}
        icon_color: >-
          {% if states(config.entity) in ['unknown', 'unavailable', 'none']  %}
          red

          {% else %} 

          {% endif %}
        tap_action:
          action: navigate
          navigation_path: /dashboard-iphone/homepod_mini_gost
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: media_player.homepod_mini_gost
    alignment: end
    card_mod:
      style: |
        {% include 'thirdary_chip_ha_card.jinja' %}
grid_options:
  columns: 6
  rows: auto
card_mod:
  style: |
    {% set entity = 'media_player.homepod_mini_gost' %}
    {% set state_on = 'playing' %}
    {% set hover = true %}

    {% include 'stack_card.jinja'%}
