type: custom:vertical-stack-in-card
cards:
  - type: custom:mushroom-template-card
    secondary: >-
      {% if is_state(config.entity, 'playing') %}
        {{ state_attr(config.entity, 'media_artist') | default('Неизвестно', true) }}
      {% elif states(config.entity) in ['unknown', 'unavailable', 'none']  %}
      Неизвестно

      {% else %}
        Не исполняется
      {% endif %}
    icon: phu:homepod-mini
    features_position: bottom
    icon_tap_action:
      action: perform-action
      perform_action: media_player.media_play_pause
      target:
        entity_id: media_player.homepod_mini_gost
    tap_action:
      action: navigate
      navigation_path: /dashboard-iphone/homepod_mini_gost
    color: |
      {% if is_state(config.entity, 'playing') %} 120,120,120
        {% else%} grey
        {% endif %}
    primary: >-
      {% if is_state(config.entity, 'playing') and
      state_attr(config.entity,'media_title') is not none and
      state_attr(config.entity,'media_title') != '' %}
        {% if state_attr(config.entity,'media_title') == 'Streaming with pyatv' %}
          Стриминг
        {% else %}
          {{ state_attr(config.entity, 'media_title')|truncate(80) }}
        {% endif %}
      {% else %}
        Гостиная
      {% endif %}
       ›
    entity: media_player.homepod_mini_gost
    picture: "{{state_attr(config.entity, 'entity_picture')}}"
    card_mod:
      style:
        .: |
          {% include 'mushroom_ha_card_top_space.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        icon_color: ""
        icon: ion:play-back
        tap_action:
          action: perform-action
          perform_action: media_player.media_previous_track
          target:
            entity_id:
              - media_player.homepod_mini_gost
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: template
        icon_color: ""
        icon: >
          {% set title = state_attr(config.entity,'media_title') %}


          {% if state_attr(config.entity,'media_title') is none or 
          state_attr(config.entity,'media_title') == ''%} fas:lock

          {% elif is_state(config.entity, 'playing') %} fas:pause

          {% elif is_state(config.entity, 'paused') %} fas:play

          {% else%}fas:play

          {% endif %}
        tap_action:
          action: perform-action
          perform_action: media_player.media_play_pause
          target:
            entity_id: media_player.homepod_mini_gost
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: media_player.homepod_mini_gost
      - type: template
        icon_color: ""
        icon: ion:play-forward
        tap_action:
          action: perform-action
          perform_action: media_player.media_next_track
          target:
            entity_id: media_player.homepod_mini_gost
        hold_action:
          action: none
        double_tap_action:
          action: none
    alignment: justify
    card_mod:
      style: |
        {% set top = 8 %} 
        {% set font_weight = 400 %}
        {% set font_size = 14 %}
        {% set chip_height = 45 %}
        {% include 'chip_secondary_shape.jinja' %}
grid_options:
  columns: 6
  rows: 2
card_mod:
  style: |
    {% set entity = 'media_player.homepod_mini_gost' %}
    {% set state_on = 'playing' %}
    {% set hover = true %}

    {% include 'stack_card.jinja'%}
