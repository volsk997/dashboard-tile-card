type: custom:vertical-stack-in-card
cards:
  - type: custom:mushroom-template-card
    secondary: ""
    icon: >-
      {% if state_attr(config.entity, 'icon') != None %}
      {{state_attr(config.entity, 'icon')}} {% else %} mdi:account {% endif %}
    entity: person.stanislav
    badge_icon: ""
    badge_color: ""
    hold_action:
      action: none
    tap_action:
      action: more-info
    double_tap_action:
      action: none
    picture: "{{state_attr(config.entity, 'entity_picture')}}"
    primary: Станислав
    features_position: bottom
    card_mod:
      style:
        mushroom-shape-icon$: >-
          {% set shape_variable = 'shape-color' %} {% include
          'mushroom_icon_shape.jinja' %}   {% set z = 100 %} {% set color %}
            {% set entity = config.entity %}{% include 'person_colors.jinja' %}
          {% endset %} {% set color = color | trim %} {% include
          'mushroom_icon_shape_after.jinja' %}
        .: |
          {% include 'mushroom_ha_card_top_space.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.iphone_15_pro_max_focus
            state: "on"
        chip:
          type: template
          tap_action:
            action: more-info
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: fas:moon
          icon_color: purple
          entity: binary_sensor.iphone_15_pro_max_focus
      - type: template
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: device_tracker.volsk_15promax
        icon: |-
          {% if is_state(config.entity, 'home') %} mdi:wifi-check
          {% else %} mdi:wifi-remove
          {% endif %}
        icon_color: |-
          {% if is_state(config.entity, 'home') %} 1
          {% else %} 150,150,150,0.5
          {% endif %}
        content: ""
      - type: template
        entity: device_tracker.iphone_15_pro_max_ble
        icon: |-
          {% if is_state(config.entity, 'home') %} mdi:bluetooth-connect
          {% else %} mdi:bluetooth
          {% endif %}
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon_color: |-
          {% if is_state(config.entity, 'home') %} 1
          {% else %} 150,150,150,0.5
          {% endif %}
      - type: template
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: mdi:circle
        entity: person.stanislav
        icon_color: "{% include 'person_colors.jinja' %}"
        content: >+
          {% set x = state_attr('sensor.iphone_15_pro_max_geocoded_location',
          'Locality' ), state_attr('sensor.iphone_15_pro_max_geocoded_location',
          'Name' )  %}

          {% if is_state(config.entity, 'home')%} Дома

          {% elif is_state(config.entity,
          'not_home')%}{{x|string|truncate(50,true)|replace ("'","")|replace
          ("(","")|replace(")","")}}

          {% elif is_state(config.entity, 'unavailable')%} Неизвестно

          {% else %} {{states(config.entity)}} 

          {% endif %}

      - type: template
        entity: sensor.iphone_15_pro_max_battery_level
        icon: >-
          {%- if
          is_state((config.entity|replace("level","state")),'Charging')%}mdi:battery-charging

          {% else %} 
            {% if states(config.entity)|float(0) <= 10 %} mdi:battery-10
            {% elif states(config.entity)|float(0) <= 20 %} mdi:battery-20
            {% elif states(config.entity)|float(0) <= 30 %} mdi:battery-30
            {% elif states(config.entity)|float(0) <= 40 %} mdi:battery-40
            {% elif states(config.entity)|float(0) <= 50 %} mdi:battery-50
            {% elif states(config.entity)|float(0) <= 60 %} mdi:battery-60
            {% elif states(config.entity)|float(0) <= 70 %} mdi:battery-70
            {% elif states(config.entity)|float(0) <= 80 %} mdi:battery-80
            {% elif states(config.entity)|float(0) <= 90 %} mdi:battery-90
            {% elif states(config.entity)|float(0) <= 100 %} mdi:battery
            {% else %} 
            {% endif %}
          {% endif %}
        icon_color: ""
        content: |
          {{states(config.entity)|float(0) | round()}}%
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: template
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: sensor.iphone_15_pro_max_audio_output
        icon: >-
          {% if is_state(config.entity,'Bluetooth A2DP')%}
          mdi:headphones-bluetooth

          {% elif is_state(config.entity,'Bluetooth HFS')%} mdi:phone-bluetooth

          {% elif is_state(config.entity,'Bluetooth HFP')%} mdi:phone-bluetooth

          {% elif is_state(config.entity,'Built-in Speaker')%}
          mdi:cellphone-sound

          {% elif is_state(config.entity,'CarPlay')%} mdi:car


          {% else %}

          {% endif %}
      - type: template
        entity: sensor.iphone_15_pro_max_watch_battery_level
        content: "{{states(config.entity)}}%"
        icon: tabler:device-watch-bolt
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: template
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: |-
          {% if is_state(config.entity, 'Wi-Fi') %} mdi:wifi
          {% else %}mdi:signal-cellular-3
          {% endif %}
        entity: sensor.iphone_15_pro_max_connection_type
        icon_color: ""
        content: >
          {% if is_state(config.entity, 'Wi-Fi') %}
          {{states((config.entity|replace("connection_type","ssid")))}}

          {% else %}Yota

          {% endif %}
      - type: template
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: mdi:weight-kilogram
        entity: sensor.ves_stanislav
        icon_color: ""
        content: "{{states(config.entity)|round(2)|replace(\".\",\",\")}} кг"
      - type: template
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
        content: >-
          {% set d = as_timestamp(states(config.entity))|
          timestamp_custom('%-d') %}

          {% set m = as_timestamp(states(config.entity))|
          timestamp_custom('%m')%}

          {% set y = as_timestamp(states(config.entity))|
          timestamp_custom('%Y')%}

          {% set time = as_timestamp(states(config.entity))|
          timestamp_custom('%-H:%M') %}

          {% set dn = as_timestamp(now())| timestamp_custom('%-d')%}

          {% set mn = as_timestamp(now())| timestamp_custom('%m')%}

          {% set yn = as_timestamp(now())| timestamp_custom('%Y')%}

          {%- set date = as_timestamp(states(config.entity)) -%}

          {%- set month_list =
          ['Января','Февраля','Марта','Апреля','Мая','Июня','Июля','Августа','Сентября','Октября','Ноября','Декабря']
          %}

          {%- set m_ok = date | timestamp_custom("%m",true,0) | int(0) %}

          {%- set month = month_list[m_ok-1] %}


          {% if d == dn and m == mn%} Сегодня в {{time}}

          {% elif (dn|int - d|int == 1) and m == mn %} Вчера в {{time}}

          {% else %} 


          {{ d}} {{ month}}
            
            {% if y == yn %}
            {% else %} {{y}}
            {%endif %}
          в {{time}}

          {% endif %}

          c {{state_attr(config.entity, 'device_id')}}
        icon: fas:eye
        entity: sensor.volsk_last_enter
      - type: template
        icon: tabler:device-watch
        tap_action:
          action: more-info
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: device_tracker.apple_watch_se
        icon_color: |-
          {% if is_state(config.entity, 'home') %} 1
          {% else %} 150,150,150,0.5
          {% endif %}
      - type: template
        tap_action:
          action: navigate
          navigation_path: /dashboard-service/maps
        hold_action:
          action: none
        double_tap_action:
          action: none
        content: Карта ›
        icon: mdi:map-marker-path
      - type: template
        tap_action:
          action: more-info
        entity: sensor.otzhimaniia
        icon: mdi:weight-lifter
        content: "{{states(config.entity)}}"
        hold_action:
          action: none
        double_tap_action:
          action: none
    alignment: start
    card_mod:
      style: |
        {% set top = 8 %} 
        {% set font_weight = 400 %}
        {% set font_size = 14 %}
        {% set chip_height = 45 %}
        {% include 'chip_secondary_shape.jinja' %}
grid_options:
  columns: 6
  rows: 2
card_mod:
  style: |
    {% set entity = 'person.stanislav' %}
    {% set state_on = 'home' %}
    {% set hover = true %}

    {% include 'stack_card.jinja'%}
