type: custom:vertical-stack-in-card
cards:
  - type: custom:mushroom-template-card
    secondary: >-
      {% if states(config.entity) in ['unknown', 'unavailable', 'none']  %}
      Недоступно

      {% elif is_state(config.entity, 'playing')%} 
        {% if is_state_attr(config.entity, 'app_id', 'com.apple.TVAirPlay') and state_attr('media_player.gostinaia', 'media_title') == '' %} 
        {{state_attr(config.entity, 'app_name')}}
        {% else %} 
          {% if state_attr(config.entity, 'media_title') == '' %}Без названия
          {% else %} 
            {% set title = state_attr(config.entity,'media_title') %}
             {{ title |replace("!⃝","🔞")}}
          {% endif %}
        {% endif %}
      {% elif is_state(config.entity, 'standby')%} Сон

      {% elif is_state(config.entity, 'paused')%} Пауза

      {% else %} Бездействие

      {% endif %}
    icon: phu:apple-tv
    entity: media_player.gostinaia
    badge_color: ""
    badge_icon: ""
    picture: "{{state_attr('media_player.gostinaia', 'entity_picture')}}"
    icon_color: |-
      {% if is_state(config.entity, 'playing') %} black
      {% else %} disabled
      {% endif %}
    fill_container: true
    tap_action:
      action: none
    layout: horizontal
    primary: |-
      {% if is_state(config.entity, 'playing')%} 
        {% if is_state_attr(config.entity, 'app_id', 'ru.kinopoisk')%} Кинопоиск
        {% elif is_state_attr(config.entity, 'app_id', 'com.google.ios.youtube')%} YouTube
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVAirPlay')%} AirPlay
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVWatchList')%} AppleTV+
        {% elif is_state_attr(config.entity, 'app_id', 'com.apple.TVMusic')%}
                 {% if state_attr(config.entity, 'media_artist') == '' %}Apple Music
                 {% else %} {{ state_attr(config.entity, 'media_artist')|truncate(100) }}
                 {% endif %}
        {% elif is_state_attr(config.entity, 'app_id', 'org.videolan.vlc-ios')%} VLC
        {% elif is_state_attr(config.entity, 'app_id', 'ru.ivi')%} Иви
        {% else %} Apple TV
        {% endif %}
        {% else %} Apple TV
      {% endif %}
    card_mod:
      style:
        mushroom-shape-icon$: |
          {% include 'mushroom_icon_shape.jinja' %} 
        mushroom-state-info$: |
          .container {
           --card-secondary-color: {{states('input_text.tsvet_shrifta_vtorostepennaia_informatsiia')}};
           padding-right: 25px;
        .: |
          {% include 'mushroom_ha_card_transparent.jinja' %} 
  - type: custom:mushroom-chips-card
    chips: []
    alignment: end
    card_mod:
      style: |
        {% include 'fixed_entity_picture.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state: standby
        chip:
          type: spacer
      - type: template
        entity: switch.apple_tv_switch
        tap_action:
          confirmation:
            text: Вы уверены?
          action: toggle
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: mdi:power
        icon_color: "1"
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
        chip:
          type: template
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: ph:line-vertical
          icon_color: 120,120,120,0.5
          card_mod:
            style: |
              ha-card {
                margin-left: -20px;
                margin-right: -20px;
              }
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: binary_sensor.appletv_media_progress
            state: "on"
        chip:
          type: template
          icon: fas:backward-step
          icon_color: "1"
          tap_action:
            action: call-service
            service: media_player.media_previous_track
            target:
              entity_id: media_player.gostinaia
          hold_action:
            action: none
          double_tap_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: binary_sensor.appletv_media_progress
            state: "on"
        chip:
          type: template
          entity: media_player.gostinaia
          tap_action:
            action: call-service
            service: media_player.media_play_pause
            target:
              entity_id: media_player.gostinaia
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: >-
            {% if is_state('media_player.gostinaia', 'playing') %}fas:pause {%
            elif is_state('media_player.gostinaia', 'paused') %}fas:play {% else
            %}fas:exclamation-circle {% endif %}
          icon_color: "1"
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: binary_sensor.appletv_media_progress
            state: "on"
        chip:
          type: template
          icon: fas:forward-step
          icon_color: "1"
          tap_action:
            action: call-service
            service: media_player.media_next_track
            target:
              entity_id: media_player.gostinaia
          hold_action:
            action: none
          double_tap_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: binary_sensor.appletv_media_progress
            state: "off"
          - condition: or
            conditions:
              - condition: state
                entity: sensor.appletv_app
                state_not: Кинопоиск
              - condition: state
                entity: media_player.gostinaia
                state_not: playing
        chip:
          type: template
          entity: sensor.appletv_app
          tap_action:
            action: perform-action
            perform_action: media_player.select_source
            target:
              entity_id: media_player.gostinaia
            data:
              source: Кинопоиск
          icon: yandex:kinopoisk
          icon_color: "1"
          hold_action:
            action: none
          double_tap_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: binary_sensor.appletv_media_progress
            state: "off"
          - condition: or
            conditions:
              - condition: state
                entity: sensor.appletv_app
                state_not: Кинопоиск
              - condition: state
                entity: media_player.gostinaia
                state_not: playing
        chip:
          type: template
          entity: sensor.appletv_app
          tap_action:
            action: perform-action
            perform_action: media_player.select_source
            target:
              entity_id: media_player.gostinaia
            data:
              source: VK Видео
          icon: fab:vk
          icon_color: "1"
          hold_action:
            action: none
          double_tap_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: binary_sensor.appletv_media_progress
            state: "off"
          - condition: or
            conditions:
              - condition: state
                entity: sensor.appletv_app
                state_not: Кинопоиск
              - condition: state
                entity: media_player.gostinaia
                state_not: playing
        chip:
          type: template
          entity: sensor.appletv_app
          tap_action:
            action: perform-action
            perform_action: media_player.select_source
            target:
              entity_id: media_player.gostinaia
            data:
              source: VLC
          icon: mdi:vlc
          icon_color: "1"
          hold_action:
            action: none
          double_tap_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: media_player.gostinaia
            state: playing
          - condition: state
            entity: sensor.appletv_app
            state: Кинопоиск
        chip:
          type: template
          tap_action:
            action: perform-action
            perform_action: remote.send_command
            target:
              entity_id: remote.gostinaia
            data:
              num_repeats: 1
              delay_secs: 0.4
              hold_secs: 0
              command:
                - down
                - left
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:skip-previous
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: media_player.gostinaia
            state: playing
          - condition: state
            entity: sensor.appletv_app
            state: Кинопоиск
        chip:
          type: spacer
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state_not: standby
          - condition: state
            entity: media_player.gostinaia
            state: playing
          - condition: state
            entity: sensor.appletv_app
            state: Кинопоиск
        chip:
          type: template
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:skip-next
          tap_action:
            action: perform-action
            perform_action: remote.send_command
            target:
              entity_id: remote.gostinaia
            data:
              num_repeats: 1
              delay_secs: 0.4
              hold_secs: 0
              command:
                - down
                - right
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state: standby
        chip:
          type: spacer
    alignment: justify
    card_mod:
      style: |
        {% set top = 8 %} 
        {% set font_weight = 600 %}
        {% set font_size = 14 %}
        {% set chip_height = 45 %}
        {% include 'chip_secondary_shape.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        icon: >-
          {% if states(config.entity) in ['unknown', 'unavailable', 'none']  %}
          mdi:alert-circle

          {% else %} mdi:chevron-right

          {% endif %}
        icon_color: >-
          {% if states(config.entity) in ['unknown', 'unavailable', 'none']  %}
          red

          {% else %} 

          {% endif %}
        tap_action:
          action: navigate
          navigation_path: /dashboard-iphone/appletv_ios
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: media_player.yandex_station_m00en2100jayck
    alignment: end
    card_mod:
      style: |
        {% include 'thirdary_chip_ha_card.jinja' %}
grid_options:
  columns: 6
  rows: auto
card_mod:
  style: |
    {% set entity = 'media_player.gostinaia' %}
    {% set state_on = 'playing' %}
    {% set hover = true %}

    {% include 'stack_card.jinja'%}
