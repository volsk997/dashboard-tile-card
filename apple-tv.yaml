type: custom:vertical-stack-in-card
cards:
  - type: custom:mushroom-template-card
    secondary: |2

        {% if states(config.entity) in ['unknown', 'unavailable', 'none']  %} Недоступно
        {% elif is_state(config.entity, 'playing')%} 
          {% if is_state_attr(config.entity, 'app_id', 'com.apple.TVAirPlay') and state_attr('media_player.gostinaia', 'media_title') == '' %} 
          {{state_attr(config.entity, 'app_name')}}
          {% else %} 
            {% if state_attr(config.entity, 'media_title') == '' %}Без названия
            {% else %} 
              {% set title = state_attr(config.entity,'media_title') %}
                {{ title |replace("!⃝","🔞")}}
            {% endif %}
          {% endif %}
        {% elif is_state(config.entity, 'off')%} Сон
        {% elif is_state(config.entity, 'paused')%} Пауза
        {% else %} Бездействие
        {% endif %}
    icon: phu:apple-tv
    features_position: bottom
    icon_tap_action:
      action: perform-action
      perform_action: media_player.media_play_pause
      target:
        entity_id: media_player.gostinaia
    tap_action:
      action: navigate
      navigation_path: /dashboard-iphone/appletv_ios
    color: |-
      {% if is_state(config.entity, 'playing') %} black
      {% else %} grey
      {% endif %}
    primary: |-
      {% if is_state(config.entity, 'playing')%} 
        {% if is_state_attr(config.entity, 'app_id', 'com.apple.TVMusic')%}
                 {% if state_attr(config.entity, 'media_artist') == '' %} Music
                 {% else %} {{ state_attr(config.entity, 'media_artist')}}
                 {% endif %}
        {% else %} {{ state_attr(config.entity, 'app_name')}}
        {% endif %}
      {% else %}  TV
      {% endif %}
       ›
    entity: media_player.gostinaia
    picture: "{{state_attr(config.entity, 'entity_picture')}}"
    card_mod:
      style:
        .: |
          {% include 'mushroom_ha_card_top_space.jinja' %}
  - type: custom:mushroom-chips-card
    chips: []
    alignment: end
    card_mod:
      style: |
        {% include 'fixed_entity_picture.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: switch.apple_tv_switch
        tap_action:
          confirmation:
            text: Вы уверены?
          action: toggle
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: mdi:power
        icon_color: "1"
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state: playing
        chip:
          type: template
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: ph:line-vertical
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state: playing
        chip:
          type: template
          icon: ion:play-back
          icon_color: |-
            {% if is_state('binary_sensor.appletv_media_progress','on')%} 1
            {% else %} 120,120,120, 0.4
            {% endif %}
          tap_action:
            action: call-service
            service: media_player.media_previous_track
            target:
              entity_id: media_player.gostinaia
          hold_action:
            action: none
          double_tap_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state: playing
        chip:
          type: template
          entity: media_player.gostinaia
          tap_action:
            action: call-service
            service: media_player.media_play_pause
            target:
              entity_id: media_player.gostinaia
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: >-
            {% if is_state('media_player.gostinaia', 'playing') %}fas:pause {%
            elif is_state('media_player.gostinaia', 'paused') %}fas:play {% else
            %}fas:exclamation-circle {% endif %}
          icon_color: |-
            {% if is_state('binary_sensor.appletv_media_progress','on')%} 1
            {% else %} 120,120,120, 0.4
            {% endif %}
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.gostinaia
            state: playing
        chip:
          type: template
          icon: ion:play-forward
          icon_color: |-
            {% if is_state('binary_sensor.appletv_media_progress','on')%} 1
            {% else %} 120,120,120, 0.4
            {% endif %}
          tap_action:
            action: call-service
            service: media_player.media_next_track
            target:
              entity_id: media_player.gostinaia
          hold_action:
            action: none
          double_tap_action:
            action: none
    alignment: center
    card_mod:
      style: |
        {% set top = 8 %} 
        {% set font_weight = 600 %}
        {% set font_size = 14 %}
        {% set chip_height = 45 %}
        {% include 'chip_secondary_shape.jinja' %}
grid_options:
  columns: 6
  rows: 2
card_mod:
  style: |
    {% set entity = 'media_player.gostinaia' %}
    {% set state_on = 'playing' %}
    {% set hover = true %}

    {% include 'stack_card.jinja'%}
