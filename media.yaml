type: custom:vertical-stack-in-card
cards:
  - type: custom:mushroom-template-card
    secondary: >-
      {% set player = config.entity %}

      {% include 'time_position_yandex.jinja' %}


      {% if is_state(config.entity, 'playing') and
      is_state('binary_sensor.multirum_sostoianie','on')%}

      • Везде

      {% else %}{% endif %}
    icon: yandex:station-mini-2
    features_position: bottom
    icon_tap_action:
      action: perform-action
      perform_action: media_player.media_play_pause
      target:
        entity_id: media_player.yandex_station_m00en2100jayck
    tap_action:
      action: navigate
      navigation_path: /dashboard-iphone/mini
    primary: |-
      {% set title = state_attr(config.entity,'media_title') %}

      {% if is_state(config.entity, 'playing') %} 
        {% if state_attr(config.entity,'media_title') is none or  state_attr(config.entity,'media_title') == ''%} Недоступно
        {% else%} {{title}} {% endif %}
      {% else %} Станция Мини
      {% endif %} ›
    entity: media_player.yandex_station_m00en2100jayck
    picture: "{{state_attr(config.entity, 'entity_picture_local')}}"
    color: grey
    card_mod:
      style:
        .: |
          {% include 'mushroom_ha_card_top_space.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.yandex_station_m00en2100jayck
            state: playing
        chip:
          type: template
          tap_action:
            action: perform-action
            perform_action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_m00en2100jayck
            data:
              media_content_type: command
              media_content_id: лайк
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:heart
      - type: template
        icon_color: ""
        icon: >-
          {% if state_attr('media_player.yandex_station_m00en2100jayck',
          'media_duration')|int(0) > 0 %}

          fas:backward-step

          {% else %}

          {% endif %}
        tap_action:
          action: perform-action
          perform_action: media_player.media_previous_track
          target:
            entity_id:
              - media_player.yandex_station_m00en2100jayck
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: template
        icon_color: ""
        icon: |-
          {% if is_state(config.entity, 'paused')%}fas:play
          {% elif is_state(config.entity, 'playing')%}fas:pause
          {% else %} fas:lock
          {% endif %}
        tap_action:
          action: perform-action
          perform_action: script.turn_on
          target:
            entity_id: script.yandex_station_play_pause_extended
          data:
            variables:
              entity: media_player.yandex_station_m00en2100jayck
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: media_player.yandex_station_m00en2100jayck
      - type: template
        icon_color: ""
        icon: >-
          {% if state_attr('media_player.yandex_station_m00en2100jayck',
          'media_duration')|int(0) > 0 %}

          fas:forward-step

          {% else %}

          {% endif %}
        tap_action:
          action: perform-action
          perform_action: media_player.media_next_track
          target:
            entity_id: media_player.yandex_station_m00en2100jayck
        hold_action:
          action: none
        double_tap_action:
          action: none
      - type: conditional
        conditions:
          - condition: state
            entity: media_player.yandex_station_m00en2100jayck
            state: playing
        chip:
          type: template
          tap_action:
            action: perform-action
            perform_action: media_player.play_media
            target:
              entity_id: media_player.yandex_station_m00en2100jayck
            data:
              media_content_type: command
              media_content_id: дизлайк
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:heart-broken
    alignment: justify
    card_mod:
      style: |
        {% set top = 8 %} 
        {% set font_weight = 400 %}
        {% set font_size = 14 %}
        {% set chip_height = 45 %}
        {% include 'chip_secondary_shape.jinja' %}
grid_options:
  columns: 6
  rows: 2
card_mod:
  style: |
    {% set entity = 'media_player.yandex_station_m00en2100jayck' %}
    {% set state_on = 'playing' %}
    {% set hover = true %}

    {% include 'stack_card.jinja'%}
