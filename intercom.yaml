type: custom:vertical-stack-in-card
cards:
  - type: custom:mushroom-template-card
    icon: |-
      {% if is_state(config.entity, 'on') %} mdi:check
      {% else %}mdi:lock-smart
      {% endif %}
    features_position: bottom
    icon_tap_action:
      action: none
    tap_action:
      action: navigate
      navigation_path: /dashboard-iphone/domofon
    color: |-
      {% set color = 'green' %}
      {% if is_state(config.entity, 'on') %} {{color}}
      {% else %} grey
      {% endif %}
    primary: Домофон ›
    entity: binary_sensor.domofon_vkhodiashchii_zvonok
    card_mod:
      style:
        .: |
          {% include 'mushroom_ha_card_top_space.jinja' %}
  - type: custom:mushroom-chips-card
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.domofon_vkhodiashchii_zvonok
            state: "on"
        chip:
          type: template
          tap_action:
            action: toggle
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:check
          icon_color: green
          entity: button.domofon_propustit
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.domofon_vkhodiashchii_zvonok
            state: "on"
        chip:
          type: template
          tap_action:
            action: toggle
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:close
          icon_color: red
          entity: button.domofon_otkazat
      - type: conditional
        conditions:
          - condition: state
            entity: switch.domofon_otkryvat_na_sleduiushchii_zvonok
            state: "on"
        chip:
          type: template
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: "{{states[config.entity].attributes.icon}}"
          entity: switch.domofon_otkryvat_na_sleduiushchii_zvonok
      - type: conditional
        conditions:
          - condition: state
            entity: switch.domofon_otkliuchit_trubku_domofona
            state: "on"
        chip:
          type: template
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          icon: mdi:volume-off
          entity: switch.domofon_otkliuchit_trubku_domofona
      - type: conditional
        conditions:
          - condition: state
            entity: switch.domofon_vsegda_sbrasyvat
            state: "on"
        chip:
          type: template
          content: ""
          icon: "{{states[config.entity].attributes.icon}}"
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          entity: switch.domofon_vsegda_sbrasyvat
      - type: conditional
        conditions:
          - condition: state
            entity: switch.domofon_otkryvat_vsegda
            state: "on"
        chip:
          type: template
          content: ""
          icon: "{{states[config.entity].attributes.icon}}"
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          entity: switch.domofon_otkryvat_vsegda
      - type: template
        tap_action:
          action: navigate
          navigation_path: /dashboard-iphone/domofon
        hold_action:
          action: none
        double_tap_action:
          action: none
        entity: binary_sensor.domofon_vkhodiashchii_zvonok
        content: "{% include 'last_changed_calc.jinja' %}"
    alignment: start
    card_mod:
      style: |
        {% set top = 8 %} 
        {% set font_weight = 400 %}
        {% set font_size = 14 %}
        {% set chip_height = 45 %}
        {% include 'chip_secondary_shape.jinja' %}
grid_options:
  columns: 6
  rows: 2
card_mod:
  style: |
    {% set entity = 'binary_sensor.domofon_vkhodiashchii_zvonok' %}
    {% set state_on = 'on' %}
    {% set hover = true %}

    {% include 'stack_card.jinja'%}
